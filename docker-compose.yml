# File: docker-compose.yml
# Description: Multi-container setup (web + db + runner, plus web-dev
#     for `make dev`). The runner sits alone on an internal-only network
#     that the web apps join; it has no internet, no secrets, and no
#     published ports.
# Author(s): Tyler Black, Richard Hall

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rokos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rokos}
      POSTGRES_DB: ${POSTGRES_DB:-rokos_tasks}
    ports:
      - "${DB_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/db/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rokos} -d ${POSTGRES_DB:-rokos_tasks}"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 3s

  web:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      runner:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://rokos:rokos@db:5432/rokos_tasks}
      SECRET_KEY: ${SECRET_KEY:-change-me-locally}
      LLM_MODE: ${LLM_MODE:-fake}
      RUNNER_URL: ${RUNNER_URL:-http://runner:9000}
    networks:
      - default
      - sandbox

  # `make dev`: Flask with auto-reload. It joins the sandbox network like
  # `web` so Submit can grade. Only started with `--profile dev`.
  web-dev:
    profiles: ["dev"]
    build: .
    # The debugger stays off: player programs can reach this service over
    # the sandbox network, and the debugger runs any Python it is sent.
    command: ["flask", "--app", "src.app:create_dev_app", "run",
              "--debug", "--no-debugger", "--host", "0.0.0.0",
              "--port", "8001"]
    ports:
      - "127.0.0.1:8001:8001"
    # Source is mounted so code changes reload without a rebuild.
    volumes:
      - ./src:/app/src
      - ./content:/app/content:ro
    depends_on:
      db:
        condition: service_healthy
      runner:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://rokos:rokos@db:5432/rokos_tasks}
      SECRET_KEY: ${SECRET_KEY:-change-me-locally}
      LLM_MODE: ${LLM_MODE:-fake}
      RUNNER_URL: ${RUNNER_URL:-http://runner:9000}
    networks:
      - default
      - sandbox

  # Runs untrusted player code. Every setting here is part of the sandbox;
  # read src/runner/AGENTS.md before changing any of them.
  runner:
    build:
      context: .
      dockerfile: Dockerfile.runner
    # No environment block on purpose: the runner gets no secrets.
    read_only: true
    init: true
    ipc: none
    # The runner keeps a private IPC namespace. Disable System V allocation.
    sysctls:
      kernel.shmmax: "0"
      kernel.shmall: "0"
      kernel.msgmni: "0"
      kernel.sem: "0 0 0 0"
    cap_drop:
      - ALL
    # Only so the server can switch each run to its slot user. Player
    # programs run as those users and end up with no capabilities.
    cap_add:
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    # 8 slots x 16 processes, plus the server. Memory: 8 x 256 MB.
    pids_limit: 192
    mem_limit: 2560m
    cpus: 2
    tmpfs:
      - /sandbox/0:uid=200001,gid=200001,mode=0700,size=16m,noexec,nosuid,nodev
      - /sandbox/1:uid=200002,gid=200002,mode=0700,size=16m,noexec,nosuid,nodev
      - /sandbox/2:uid=200003,gid=200003,mode=0700,size=16m,noexec,nosuid,nodev
      - /sandbox/3:uid=200004,gid=200004,mode=0700,size=16m,noexec,nosuid,nodev
      - /sandbox/4:uid=200005,gid=200005,mode=0700,size=16m,noexec,nosuid,nodev
      - /sandbox/5:uid=200006,gid=200006,mode=0700,size=16m,noexec,nosuid,nodev
      - /sandbox/6:uid=200007,gid=200007,mode=0700,size=16m,noexec,nosuid,nodev
      - /sandbox/7:uid=200008,gid=200008,mode=0700,size=16m,noexec,nosuid,nodev
    networks:
      - sandbox
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 3s

networks:
  sandbox:
    internal: true

volumes:
  postgres_data:
