# File: ci.yml
# Description: Runs `make check` (lint, header check, all tests including
#     Selenium, coverage >= 90%) on every non-draft pull request into dev
#     or main, and on every push to them. Meant to be a required status
#     check named "check". No secrets; the LLM is forced to fake mode.
# Author(s): Tyler Black

name: CI

on:
  pull_request:
    branches: [main, dev]
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LLM_MODE: fake
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: make setup

      # ubuntu-latest ships Google Chrome; Selenium Manager fetches the
      # matching driver.
      - name: Lint, test, and coverage
        run: make check

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: htmlcov
          path: htmlcov/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload e2e failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failures
          path: .pr/e2e-failures/
          if-no-files-found: ignore
          retention-days: 7

      - name: Build Docker images
        if: hashFiles('docker-compose.yml') != ''
        run: docker compose build
