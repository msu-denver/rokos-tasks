# File: main-source-branch.yml
# Description: Fails any pull request into main unless it comes from this
#     repository's dev branch. Required status check on main's branch
#     protection, so only dev can be merged into main.
# Author(s): Tyler Black

name: Main source branch check

# pull_request_target runs the copy of this workflow on main, so a pull
# request cannot edit the check to make itself pass. No code is checked out.
on:
  pull_request_target:
    branches: [main]
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  only-dev-into-main:
    name: only-dev-into-main
    runs-on: ubuntu-latest
    steps:
      - name: Require the head branch to be dev in this repository
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          if [ "$HEAD_REF" != "dev" ] || [ "$HEAD_REPO" != "$BASE_REPO" ]; then
            echo "::error::Only $BASE_REPO:dev can be merged into main. This pull request is from $HEAD_REPO:$HEAD_REF."
            exit 1
          fi
          echo "OK: pull request comes from dev."
